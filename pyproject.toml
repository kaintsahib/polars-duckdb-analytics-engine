[project]
name = "polars-duckdb-analytics-engine"
version = "0.1.0"
description = "Sub-50ms Zero-Copy Analytics Engine built with Polars, DuckDB, and FastAPI"
authors = [
    {name = "Gaurav Sahib", email = "gauravinnocent41@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn[standard] (>=0.42.0,<0.43.0)",
    "polars (>=1.39.3,<2.0.0)",
    "duckdb (>=1.5.1,<2.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "pyarrow (>=26.0.1,<27.0.0)"
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
httpx = ">=0.28.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
